# Base Configuration
spring.application.name=package-quality-inspection
spring.profiles.active=dev

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Custom Application Upload & ML Model Configurations
app.upload.dir=${UPLOAD_DIR:uploads/}
cnn.model.path=${MODEL_PATH:models/package-quality-model.pt}
cnn.confidence.threshold=0.85

# Static resources mapping for uploaded files
spring.web.resources.static-locations=classpath:/static/,file:${app.upload.dir}
